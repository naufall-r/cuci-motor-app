<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Petugas - CleanRide Express</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: #ffffff;
            width: 100%;
            max-width: 400px;
        }
        .btn-login {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: #0d6efd;
            border: none;
        }
        .btn-login:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>

    <div class="card card-login p-4 m-3">
        <div class="text-center mb-4">
            <div class="bg-primary bg-opacity-10 text-primary d-inline-block p-3 rounded-circle mb-2">
                <i class="fa-solid fa-motorcycle fs-2"></i>
            </div>
            <h4 class="fw-bold">CleanRide Express</h4>
            <p class="text-muted small">Login Petugas Antrean</p>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2 small text-center" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-medium text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-regular fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Masukkan username..." required />
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-medium text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Masukkan password..." required />
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100 text-white">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Masuk Dashboard
            </button>
        </form>
    </div>

</body>
</html>
